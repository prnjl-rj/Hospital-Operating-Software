name: hos-enterprise

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hos-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: hos_admin
      POSTGRES_PASSWORD: hos_master_dev_pwd
      POSTGRES_DB: hos_db
    ports:
      - "5435:5432"
    volumes:
      - hos_pgdata:/var/lib/postgresql/data
      - ./database/init/01-init-schemas-and-roles.sql:/docker-entrypoint-initdb.d/01-init-schemas-and-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hos_admin -d hos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hos-internal-net

  redis:
    image: redis:7-alpine
    container_name: hos-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "hos_redis_local_pwd"]
    ports:
      - "6380:6379"
    volumes:
      - hos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "hos_redis_local_pwd", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hos-internal-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: hos-kafka
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - hos_kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - hos-internal-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hos-kafka-ui
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hos-kraft-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - hos-internal-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hos-prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9095:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - hos_prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hos-internal-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hos-alertmanager
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9096:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - hos-internal-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: hos-grafana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3035:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: hos_grafana_dev_pwd
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - hos_grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hos-internal-net

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hos-api-gateway
    profiles: ["full-containers"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      IDENTITY_DATABASE_URL: "postgresql://hos_identity_user:hos_identity_local_pwd@postgres:5432/hos_db?schema=identity"
      HOSPITAL_CORE_DATABASE_URL: "postgresql://hos_core_user:hos_core_local_pwd@postgres:5432/hos_db?schema=hospital_core"
      CLINICAL_DATABASE_URL: "postgresql://hos_clinical_user:hos_clinical_local_pwd@postgres:5432/hos_db?schema=clinical"
      DIAGNOSTICS_DATABASE_URL: "postgresql://hos_diag_user:hos_diag_local_pwd@postgres:5432/hos_db?schema=diagnostics_pharmacy"
      OPERATIONS_DATABASE_URL: "postgresql://hos_ops_user:hos_ops_local_pwd@postgres:5432/hos_db?schema=operations_billing"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: hos_redis_local_pwd
      KAFKA_BROKERS: kafka:29092
    networks:
      - hos-internal-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hos-frontend
    profiles: ["full-containers"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api-gateway
    ports:
      - "5175:80"
    networks:
      - hos-internal-net

volumes:
  hos_pgdata:
  hos_redisdata:
  hos_kafkadata:
  hos_prometheusdata:
  hos_grafanadata:

networks:
  hos-internal-net:
    driver: bridge
