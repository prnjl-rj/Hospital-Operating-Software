{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hos-{{ $name | lower }}
  labels:
    app: hos-{{ $name | lower }}
spec:
  replicas: {{ $svc.minReplicas }}
  selector:
    matchLabels:
      app: hos-{{ $name | lower }}
  template:
    metadata:
      labels:
        app: hos-{{ $name | lower }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: {{ $name | lower }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $name | lower }}:{{ $.Values.global.imageTag }}"
          ports:
            - containerPort: {{ $svc.port }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
{{- end }}

