apiVersion: v1
kind: Namespace
metadata:
  name: hos-prod
  labels:
    app.kubernetes.io/part-of: hospital-operating-software
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hos-common-config
  namespace: hos-prod
data:
  NODE_ENV: "production"
  AWS_REGION: "ap-south-1"
  KAFKA_SSL_ENABLED: "true"
  REDIS_TLS_ENABLED: "true"
  OTEL_SERVICE_NAMESPACE: "hos-enterprise"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hos-api-gateway
  namespace: hos-prod
  labels:
    app: hos-api-gateway
    tier: gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hos-api-gateway
  template:
    metadata:
      labels:
        app: hos-api-gateway
        tier: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api-gateway
          image: 000000000000.dkr.ecr.ap-south-1.amazonaws.com/hos-enterprise/api-gateway:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: hos-common-config
            - secretRef:
                name: hos-runtime-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/gateway/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hos-api-gateway
  namespace: hos-prod
spec:
  type: ClusterIP
  selector:
    app: hos-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hos-api-gateway-hpa
  namespace: hos-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hos-api-gateway
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hos-api-gateway-pdb
  namespace: hos-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: hos-api-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hos-default-zero-trust
  namespace: hos-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hos-prod
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hos-alb-ingress
  namespace: hos-prod
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/gateway/health
spec:
  rules:
    - host: api.hospital-hos.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hos-api-gateway
                port:
                  number: 80

