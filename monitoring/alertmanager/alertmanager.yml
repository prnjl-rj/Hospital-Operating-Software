global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: "hos-ops-webhook"

receivers:
  - name: "hos-ops-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:4000/api/v1/monitoring/alerts-webhook"
        send_resolved: true

