groups:
  - name: hos_critical_alerts
    rules:
      - alert: HosServiceUnavailable
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HOS target {{ $labels.instance }} is down"
          description: "Target {{ $labels.job }} / {{ $labels.instance }} has been unreachable for > 1 minute."

      - alert: HosHighApiErrorRate
        expr: rate(hos_http_requests_errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API 5xx error rate detected on {{ $labels.service }}"

      - alert: HosHighApiLatencyP95
        expr: histogram_quantile(0.95, sum(rate(hos_http_request_duration_seconds_bucket[5m])) by (le, service)) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile API latency exceeds 1.0s on {{ $labels.service }}"

      - alert: HosOutboxBacklogGrowing
        expr: hos_outbox_pending_events_total > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Transactional Outbox backlog > 100 pending events"

      - alert: HosKafkaDlqMessagesDetected
        expr: increase(hos_kafka_dlq_messages_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messages landed in Apache Kafka Dead-Letter Queue (DLQ)"

      - alert: HosKafkaConsumerLagHigh
        expr: hos_kafka_consumer_lag_records > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag exceeds 500 records"

